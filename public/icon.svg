<svg width="128" height="128" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="al1-bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12434a"/>
      <stop offset="100%" stop-color="#061c1f"/>
    </linearGradient>
    <linearGradient id="al1-stroke" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a4d881" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#256068" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a4d881" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="al1-one" x1="25" y1="12" x2="30" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbf58c"/>
      <stop offset="100%" stop-color="#8dd25e"/>
