  <!-- "a" -->
  <path d="M 16.2 18 V 26.5 M 16.2 21 C 15.3 18.5 12.8 17.6 10.6 18.6 C 8.6 19.6 8 22.2 8.8 24.2 C 9.8 26.4 12.8 27.2 15.5 25.8" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "l" -->
  <path d="M 20.8 12.8 V 26.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>

  <!-- "1" -->
  <path d="M 25.4 15.8 L 28.6 13 V 26.5" stroke="url(#al1-one)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Active indicator dot -->
  <circle cx="32.5" cy="7.5" r="3" fill="#a4d881"/>
  <circle cx="32.5" cy="7.5" r="4.5" stroke="#061c1f" stroke-width="1.5" fill="none"/>
